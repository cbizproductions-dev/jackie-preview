# C-BIZ Console — one Worker serving the static app and a read-only /api/snapshot.
name = "cbiz-console"
account_id = "5944c3a0070ea5f916836cf0c750a1ad"   # Cbizproductions@gmail.com's Account — pinned so a deploy can never land elsewhere
main = "src/worker/index.ts"
compatibility_date = "2026-11-01"
workers_dev = true
preview_urls = false
keep_vars = true          # never remove variables set in the Cloudflare dashboard

# App files are embedded in the Worker (scripts/embed-assets.mjs) so a deploy is one script upload.
[alias]
"cbiz-assets" = "./src/worker/assets.gen.ts"

[[kv_namespaces]]
binding = "SNAP"
id = "4601f4c5ff27423a8317fdf81cb165ac"   # set by `npx wrangler kv namespace create SNAP` (see README)

[vars]
NOTION_CALL_BUDGET = "40"   # Workers Free allows 50 outbound requests per visit; raise to ~400 on Workers Paid

[observability]
enabled = false             # no request logging: the access key is in the URL path
